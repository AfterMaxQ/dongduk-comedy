name: Import original transcripts

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract corpus
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          test -f .bootstrap/part-00
          cat .bootstrap/part-* | base64 --decode > /tmp/originals.tar.xz
          tar -xJf /tmp/originals.tar.xz
          rm -rf .bootstrap

      - name: Commit imported transcripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: add original dongduk comedy transcripts"
          git push
